name: Relay (Cloudflare)

# Deploys relay-cf/ to Cloudflare Workers (free plan). Needs the repository secrets CLOUDFLARE_API_TOKEN and
# CLOUDFLARE_ACCOUNT_ID. The relay ends up at https://fogwood-relay.<your workers.dev subdomain>.workers.dev
# TURN for browser links that can't go direct: the first deploy creates a Cloudflare Realtime TURN key with that same token
# (it needs the Realtime / Calls edit permission) and keeps it in the worker's secrets, never in the repository or the logs.
# Its AI cars are the game's own race code (rust/src/server.rs), built here into relay-cf/sim through WebAssembly, so the
# relay is deployed again whenever that code changes.
on:
  push:
    branches: [main]
    paths: ["relay-cf/**", ".github/workflows/relay-cf.yml", "rust/src/**", "rust/simwasm/**", "rust/Cargo.toml"]
  workflow_dispatch:
    inputs:
      turn_reset:
        description: "Make a new TURN key (replaces the stored one)"
        type: boolean
        default: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.130
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/simwasm
      - name: Build the AI cars (WebAssembly)
        run: |
          cd rust/simwasm
          cargo build --release --target wasm32-unknown-unknown
          wasm-bindgen --target web --out-dir ../../relay-cf/sim target/wasm32-unknown-unknown/release/fogwood_sim.wasm
          ls -la ../../relay-cf/sim
          gzip -9 -c ../../relay-cf/sim/fogwood_sim_bg.wasm | wc -c
      - name: Smoke test (the simulation loads and refuses a bad stage)
        run: |
          cd relay-cf/sim
          cat > t.mjs <<'JS'
          import { readFileSync } from "fs";
          import { initSync, Room, server_id } from "./fogwood_sim.js";
          initSync({ module: new WebAssembly.Module(readFileSync("./fogwood_sim_bg.wasm")) });
          console.log("server id", server_id().toString(16));
          try { new Room(new Uint8Array([1, 2, 3, 4, 5, 6, 7, 8, 9]), 1, 2, 0); console.log("accepted junk?"); process.exit(1); } catch (e) { console.log("refused junk:", String(e)); }
          JS
          node t.mjs && rm t.mjs
      - name: No token yet
        if: env.CF_TOKEN == ''
        run: echo "Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to deploy the relay."
      - uses: cloudflare/wrangler-action@v3
        if: env.CF_TOKEN != ''
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: relay-cf
      - name: TURN key (created once, kept in the worker's secrets)
        if: env.CF_TOKEN != ''
        working-directory: relay-cf
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/calls/turn_keys"; AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          if [ "${{ inputs.turn_reset }}" != "true" ] && npx --yes wrangler@4 secret list --format json 2>/dev/null | grep -q '"TURN_KEY_ID"'; then echo "TURN key already in place"; exit 0; fi
          for old in $(curl -s "$API" -H "$AUTH" | jq -r '.result[]? | select(.name == "fogwood") | .uid'); do
            curl -s -X DELETE "$API/$old" -H "$AUTH" | jq -c '{deleted_old_key: .success}'; done
          r=$(curl -s -X POST "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/calls/turn_keys" \
                -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" --data '{"name":"fogwood"}')
          if [ "$(echo "$r" | jq -r .success)" != "true" ]; then
            echo "::warning::No TURN key: $(echo "$r" | jq -c '[.errors[]? | {code, message}]')"; exit 0; fi
          KID=$(echo "$r" | jq -r .result.uid); KEY=$(echo "$r" | jq -r '.result.key // .result.secret'); echo "::add-mask::$KEY"
          echo "new key: id ${#KID} chars, token ${#KEY} chars"
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST "https://rtc.live.cloudflare.com/v1/turn/keys/$KID/credentials/generate-ice-servers" \
                   -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" --data '{"ttl":600}'); echo "credentials straight from the new key: HTTP $code"
          printf %s "$KID" | npx --yes wrangler@4 secret put TURN_KEY_ID >/dev/null
          printf %s "$KEY" | npx --yes wrangler@4 secret put TURN_KEY_TOKEN >/dev/null
          echo "TURN key created and stored in the worker"
      - name: TURN answers
        if: env.CF_TOKEN != ''
        run: |
          sleep 15
          curl -s -H "Origin: https://adrienby.github.io" https://fogwood-relay.adrien-paul-bonnay.workers.dev/turn | jq -c '{n: [.iceServers[] | {urls: (.urls | length), auth: (.credential != null)}], why}'
