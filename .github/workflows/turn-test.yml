name: TURN test

# does the TURN server (Cloudflare's, credentials from the relay's /turn, see web/fw_rtc.js) relay a data channel?
on:
  push:
    branches: [turn-test]
  workflow_dispatch:

jobs:
  turn:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The relay hands out TURN servers
        run: curl -s -H "Origin: http://127.0.0.1:8001" https://fogwood-relay.adrien-paul-bonnay.workers.dev/turn | jq -c '[.iceServers[] | .urls]'
      - name: A data channel through it (relayed candidates only), and round trips
        run: |
          (cd /tmp && npm i --silent --no-save playwright@1.49.1)
          (cd web && python3 -m http.server 8001 --bind 127.0.0.1 &) ; sleep 1
          PW_MODULES=/tmp/node_modules/ node web/tools/turn_test.mjs http://127.0.0.1:8001/tools/turn_test.html "$(which google-chrome)"
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
