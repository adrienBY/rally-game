name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain with Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Parity tests (Rust core vs the browser build)
        working-directory: rust
        run: |
          cargo test --release
          cargo build --release --features jni-host

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build native libraries
        working-directory: rust
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 -o ../android/app/src/main/jniLibs build --release --lib
          ls -R ../android/app/src/main/jniLibs

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Unlock the permanent signing key (same key every build, so updates install over the old app)
        env:
          KS_PASS: ${{ secrets.FOGWOOD_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS_PASS" ]; then
            echo "::warning::FOGWOOD_KEYSTORE_PASSWORD secret is not set - this APK is signed with a throwaway debug key and will not update over other builds."
            exit 0
          fi
          printf '%s' "$KS_PASS" > "$RUNNER_TEMP/kspass"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass file:"$RUNNER_TEMP/kspass" -in android/signing/fogwood-release.jks.enc -out "$RUNNER_TEMP/fogwood-release.jks"
          rm "$RUNNER_TEMP/kspass"
          echo "FOGWOOD_KEYSTORE=$RUNNER_TEMP/fogwood-release.jks" >> "$GITHUB_ENV"
          echo "FOGWOOD_KEYSTORE_PASSWORD=$KS_PASS" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build APK
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk FogwoodRally-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: FogwoodRally-apk
          path: FogwoodRally-${{ github.run_number }}.apk

      - name: Publish as a release (download it from your phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Fogwood Rally build ${{ github.run_number }}
          files: FogwoodRally-${{ github.run_number }}.apk
