name: Sound engine (wasm)

on:
  push:
    branches: [main]
    paths: ["rust/audio/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Build
        working-directory: rust/audio
        run: |
          cargo build --release --target wasm32-unknown-unknown --lib
          cp target/wasm32-unknown-unknown/release/fogwood_audio.wasm ../../fogwood_audio.wasm
          ls -l ../../fogwood_audio.wasm
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: audio-wasm-${{ github.run_number }}
          name: Sound engine wasm ${{ github.run_number }}
          prerelease: true
          files: fogwood_audio.wasm
