name: Web version (GitHub Pages)

# the browser build of the native game (Rust engine as WebAssembly, WebGL2) at https://adrienby.github.io/rally-game/
# on iPhone: Safari > Share > Add to Home Screen
on:
  push:
    branches: [main]
    paths: ["rust/**", "web/**", "android/app/src/main/assets/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.130
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Build
        run: sh web/build_web.sh
      - name: Smoke test in headless Chrome (an engine trap freezes the game in the browser)
        run: |
          (cd /tmp && npm i --silent --no-save playwright@1.49.1)
          (cd web/dist-web && python3 -m http.server 8001 --bind 127.0.0.1 &) ; sleep 1
          PW_MODULES=/tmp/node_modules/ node web/tools/smoke.mjs http://127.0.0.1:8001/index.html "$(which google-chrome)"
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist-web
      - id: deployment
        uses: actions/deploy-pages@v4
