<title>Fogwood Rally</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: a single full-bleed low-res canvas. Scene and HUD are drawn at the same resolution and pass through one dither filter. */
:root { --ground: #0b100b; color-scheme: dark; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; overflow: hidden; background: var(--ground);

  padding-right: max(16px, env(safe-area-inset-right, 0px));
  touch-action: none; overscroll-behavior: none;
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;

*, *::before, *::after { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
#view {
  position: fixed; inset: 0; width: 100vw; height: 100dvh; display: block; touch-action: none;
  image-rendering: pixelated; image-rendering: crisp-edges; background: #6f7a74; outline: none;
}
#probe {
  position: fixed; visibility: hidden; pointer-events: none;
  padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
}
</style>

<canvas id="view" tabindex="0" aria-label="Fogwood Rally. Press Enter to start. Arrow keys drive, Space is the handbrake, C changes camera, R resets the car."></canvas>
<div id="probe"></div>
