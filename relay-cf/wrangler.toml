name = "fogwood-relay"
main = "worker.js"
compatibility_date = "2026-01-01"
workers_dev = true

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[durable_objects.bindings]]
name = "DIR"
class_name = "Directory"

# free plan: SQLite-backed Durable Objects
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Directory"]

[[durable_objects.bindings]]
name = "STATS"
class_name = "Stats"

[[migrations]]
tag = "v3"
new_sqlite_classes = ["Stats"]
