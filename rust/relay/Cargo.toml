[package]
name = "fogwood_relay"
version = "0.1.0"
edition = "2021"
description = "Fogwood Rally relay: rooms, packet fan-out over UDP (app) and WebSocket (browser), a shared clock"

[dependencies]
# the relay's own AI cars (fogwood_core::server): the same race code the phones run
fogwood_core = { path = ".." }
tungstenite = { version = "0.24", default-features = false, features = ["handshake"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
