[package]
name = "fogwood_sim"
version = "0.1.0"
edition = "2021"
description = "Fogwood Rally relay AI cars for the Cloudflare Worker: fogwood_core::server through WebAssembly"

[lib]
crate-type = ["cdylib"]

[dependencies]
fogwood_core = { path = ".." }
wasm-bindgen = "=0.2.130"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "debuginfo"
