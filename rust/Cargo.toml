[package]
name = "fogwood_core"
version = "0.1.0"
edition = "2021"
description = "Fogwood Rally native core: stage generation and vehicle physics"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
jni = { version = "0.21.1", default-features = false }
libm = "0.2"
glow = "0.14"
serde_json = "1"
fogwood_audio = { path = "audio" }
# Instant / SystemTime that also work in the browser (plain std elsewhere)
web-time = "1"
miniz_oxide = "0.8"

# the app's WebSocket to the relay (TLS by rustls with ring: builds with the NDK, no cmake)
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tungstenite = { version = "0.24", default-features = false, features = ["handshake"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "0.26"
# WebRTC with the browser build (unreliable data channels: UDP even from Safari), sans-IO on our own UDP socket;
# pure Rust crypto (no OpenSSL to cross-compile)
str0m = { version = "0.20", default-features = false, features = ["rust-crypto"] }

# the browser build (WebGL2 through glow, wasm-bindgen glue)
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.130"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["HtmlCanvasElement", "WebGl2RenderingContext", "Window", "Storage", "console"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

[features]
# compiles the JNI layer on a desktop host too (used by CI to type-check it)
jni-host = []

# release speed with overflow and debug checks on: for soak tests that hunt panics (cargo build --profile stress)
[profile.stress]
inherits = "release"
overflow-checks = true
debug-assertions = true
lto = false
codegen-units = 16
strip = false

# the browser build (web/build_web.sh): keeps the wasm feature section wasm-bindgen reads
[profile.web]
inherits = "release"
strip = "debuginfo"

# str0m's pure-Rust crypto backend, with its DTLS certificate made on ring instead of aws-lc (see vendor/)
[patch.crates-io]
str0m-rust-crypto = { path = "vendor/str0m-rust-crypto" }
