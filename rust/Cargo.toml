[package]
name = "fogwood_core"
version = "0.1.0"
edition = "2021"
description = "Fogwood Rally native core: stage generation and vehicle physics"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
jni = { version = "0.21.1", default-features = false }
libm = "0.2"
glow = "0.14"
serde_json = "1"
fogwood_audio = { path = "audio" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

[features]
# compiles the JNI layer on a desktop host too (used by CI to type-check it)
jni-host = []
